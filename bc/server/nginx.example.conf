# Place the map in nginx's http context. Adjust the domain and existing
# nginx certificate paths, then include/adapt the server block there.
map $http_upgrade $bc_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name stream.example.com;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    location /bc/ {
        proxy_pass http://127.0.0.1:9443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bc_connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }
}

# Audio uplink UDP 9444 must independently reach bc-server. This HTTP proxy
# does not forward UDP. Use the same public host for control and audio, or
# configure separate UDP forwarding when nginx is on another host.
